[package]
name = "tauri-plugin-dimina"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Standalone Dimina mini-program windows for Tauri 2 hosts"
links = "tauri-plugin-dimina"
repository = "https://github.com/didi/dimina"
homepage = "https://github.com/didi/dimina/tree/main/desktop/sdk/tauri"
readme = "README.md"
keywords = ["tauri", "dimina", "mini-program", "desktop"]
categories = ["gui"]
include = ["src/**", "tests/**", "permissions/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "rt", "macros"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
