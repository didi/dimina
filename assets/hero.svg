<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Dimina 星河小程序</title>
  <desc id="desc">滴滴开源跨端小程序运行时，将 WXML、WXSS 和 JavaScript 经 DMCC 编译后运行在 Android、iOS、Harmony、Web 和桌面端。</desc>
  <metadata>The Android robot is reproduced or modified from work created and shared by Google and used according to terms described in the Creative Commons 3.0 Attribution License.</metadata>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .animated-arrow {
        stroke-dasharray: 5 5;
        animation: arrow-flow 0.75s linear infinite;
      }
      .meteor {
        animation: meteor-fall 8s linear infinite;
        will-change: transform, opacity;
      }
      .meteor-two { animation-delay: 2.7s; }
      .meteor-three { animation-delay: 5.4s; }
    }
    .meteor { opacity: 0; }
    @keyframes arrow-flow {
      to { stroke-dashoffset: -10; }
    }
    @keyframes meteor-fall {
      0%, 5% { opacity: 0; transform: translate(90px, -90px); }
      8% { opacity: 0.76; }
      30% { opacity: 0.76; transform: translate(-250px, 250px); }
      34%, 100% { opacity: 0; transform: translate(-310px, 310px); }
    }
  </style>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0070F3"/>
      <stop offset="1" stop-color="#0070F3"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAFAFA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0070F3"/>
    </marker>
    <linearGradient id="meteor-trail" x1="64" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4AAEFF" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#4AAEFF" stop-opacity="0.24"/>
      <stop offset="0.9" stop-color="#86CEFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#DDF4FF" stop-opacity="0.96"/>
    </linearGradient>
