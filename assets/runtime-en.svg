      <stop offset="0.68" stop-color="#4AAEFF" stop-opacity="0.22"/>
      <stop offset="0.9" stop-color="#86CEFF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#DDF4FF" stop-opacity="0.92"/>
    </linearGradient>
    <clipPath id="meteor-clip">
      <rect width="1200" height="584" rx="26"/>
