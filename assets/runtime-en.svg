<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="584" viewBox="0 0 1200 584" role="img" aria-labelledby="title desc">
  <title id="title">Dimina compiler and runtime flow</title>
  <desc id="desc">DMCC compiles mini program source into a runtime bundle for Android, iOS, Harmony, Web, and desktop. A message channel connects logic, view, and native capabilities inside each container.</desc>
  <metadata>The Android robot is reproduced or modified from work created and shared by Google and used according to terms described in the Creative Commons 3.0 Attribution License.</metadata>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .animated-arrow {
        stroke-dasharray: 5 5;
        animation: arrow-flow 0.75s linear infinite;
      }
      .meteor {
        animation: meteor-fall 8s linear infinite;
        will-change: transform, opacity;
      }
      .meteor-two { animation-delay: 2.7s; }
      .meteor-three { animation-delay: 5.4s; }
    }
    .meteor { opacity: 0; }
    @keyframes arrow-flow {
      to { stroke-dashoffset: -10; }
    }
    @keyframes meteor-fall {
      0%, 5% { opacity: 0; transform: translate(90px, -90px); }
      8% { opacity: 0.72; }
      30% { opacity: 0.72; transform: translate(-250px, 250px); }
      34%, 100% { opacity: 0; transform: translate(-310px, 310px); }
    }
  </style>

