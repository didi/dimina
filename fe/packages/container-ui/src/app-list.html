<div class="dimina-app__mini-content">
	<div class="dimina-app__mini-search">
		<label class="dimina-app__mini-search-input">
			<input class="dimina-app__mini-search-input-placeholder" type="search" autocomplete="off" aria-label="搜索小程序" placeholder="搜索小程序" />
		</label>
		<button type="button" class="dimina-app__mini-refresh" hidden>刷新</button>
	</div>
	<section class="dimina-app__mini-used" aria-label="应用列表">
		<div class="dimina-app__mini-used-header">
			<h2 class="dimina-app__mini-used-title">应用列表</h2>
			<button type="button" class="dimina-app__generator-link" hidden><span data-action-label></span> <span aria-hidden="true">↗</span></button>
		</div>
		<ul class="dimina-app__mini-used-list" aria-live="polite"></ul>
		<p class="dimina-app__mini-used-state" role="status" hidden></p>
	</section>
</div>
