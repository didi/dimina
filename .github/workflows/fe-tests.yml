name: Frontend Tests

on:
  pull_request:
    paths:
      - 'fe/**'
      - 'examples/miniprogram/**'
      - '.github/workflows/fe-tests.yml'
  push:
    paths:
      - 'fe/**'
      - 'examples/miniprogram/**'
      - '.github/workflows/fe-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: fe/.nvmrc
          
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 12.2.0
          package-json-file: fe/package.json
          install: false
          
      - name: Get pnpm store directory
        id: pnpm-cache
        working-directory: ./fe
        shell: bash
        run: |
          store_path="$(pnpm store path)"
          test -n "$store_path"
          echo "STORE_PATH=$store_path" >> "$GITHUB_OUTPUT"
          
      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('fe/**/package.json', 'fe/pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        working-directory: ./fe
        run: pnpm install
        
      - name: Build packages
        working-directory: ./fe
        run: pnpm --filter "@dimina/common" --filter "@dimina/compiler" build
        
      - name: Run tests
        working-directory: ./fe
        run: pnpm test
