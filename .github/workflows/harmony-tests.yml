name: Harmony Tests

on:
  push:
    # Tag releases run this workflow through Release instead.
    branches:
      - '**'
    paths:
      - 'harmony/**'
      - 'shared/**'
      - 'cmake/**'
      - '.github/workflows/harmony-tests.yml'
  pull_request:
    paths:
      - 'harmony/**'
      - 'shared/**'
      - 'cmake/**'
      - '.github/workflows/harmony-tests.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing release tag to validate or publish'
        required: false
        type: string
      dry_run:
        description: 'Validate publishing credentials without uploading packages'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to validate and publish to OHPM'
        required: true
        type: string
      dry_run:
        description: 'Validate publishing credentials without uploading packages'
        required: false
        type: boolean
        default: false
    secrets:
      HARMONY_OHPM_PRIVATE_KEY:
        required: true
      HARMONY_OHPM_KEY_PASSPHRASE:
        required: true
      HARMONY_OHPM_PUBLISH_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: harmony-tests-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  # Never interrupt an OHPM release after the core package has been published.
  cancel-in-progress: ${{ !inputs.release_tag }}

jobs:
  portable-runtime:
    name: Harmony Portable Runtime Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: fe/.nvmrc

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 12.2.0
          package-json-file: fe/package.json
          install: false

      # The regression harness loads esbuild from the compiler package.
      - name: Install runtime test dependencies
        working-directory: ./fe
        run: pnpm --filter @dimina/compiler install

      - name: Run Harmony portable runtime regressions
        run: node --test harmony/scripts/*.test.mjs

  local-test:
    name: Harmony Local Tests (macOS)
    needs: portable-runtime
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HARMONY_CLI_VERSION: '6.1.1.280'
      HARMONY_CLI_PART_A_SHA256: 'fe1a045c69e47fc42d9d31bb4ebce0e9b6558a010ff9a529e49c9dd07e7d6e67'
      HARMONY_CLI_PART_B_SHA256: 'a8bdf2f80af544b3fd14d61f102102559536d82b9c3b58514c1ae3b9dce64d6c'
      HARMONY_CLI_ARCHIVE_SHA256: '47d0e558b8285e1452f4d3611863027ec0d1135642761bef23402434e22382d4'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Validate Harmony release version and credentials
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          HARMONY_OHPM_PRIVATE_KEY: ${{ secrets.HARMONY_OHPM_PRIVATE_KEY }}
          HARMONY_OHPM_KEY_PASSPHRASE: ${{ secrets.HARMONY_OHPM_KEY_PASSPHRASE }}
          HARMONY_OHPM_PUBLISH_ID: ${{ secrets.HARMONY_OHPM_PUBLISH_ID }}
        run: |
          set -euo pipefail
          test -n "$HARMONY_OHPM_PRIVATE_KEY" || { echo 'Missing HARMONY_OHPM_PRIVATE_KEY secret' >&2; exit 1; }
          test -n "$HARMONY_OHPM_KEY_PASSPHRASE" || { echo 'Missing HARMONY_OHPM_KEY_PASSPHRASE secret' >&2; exit 1; }
          test -n "$HARMONY_OHPM_PUBLISH_ID" || { echo 'Missing HARMONY_OHPM_PUBLISH_ID secret' >&2; exit 1; }
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          core = json.loads(Path('harmony/dimina/oh-package.json5').read_text())
          adapter = json.loads(Path('harmony/map_amap/oh-package.json5').read_text())
          if tag != 'v' + core['version'] or adapter['version'] != core['version']:
              raise SystemExit('Release tag, core version and AMap adapter version must match')
          if adapter['dependencies'][core['name']] != core['version']:
              raise SystemExit('AMap adapter must depend on the released core version')
          print(f'Validated Harmony release {tag}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Harmony command-line tools
        id: harmony-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/harmony-cli/${{ env.HARMONY_CLI_VERSION }}
          key: harmony-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.HARMONY_CLI_VERSION }}

      # Huawei's download center issues authenticated, short-lived URLs. This
      # fixed mirror release is third-party; pin both parts and the combined
      # archive so any byte-level change fails CI.
      - name: Install Harmony command-line tools
        if: steps.harmony-cli-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          install_root="$HOME/harmony-cli/$HARMONY_CLI_VERSION"
          archive="$RUNNER_TEMP/ohos-sdk-mac-arm64.zip"
          download_base="https://github.com/ErBWs/ohos-sdk/releases/download/$HARMONY_CLI_VERSION/ohos-sdk-mac-arm64.zip"

          mkdir -p "$install_root"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive.aa" "$download_base.aa"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive.ab" "$download_base.ab"

          echo "$HARMONY_CLI_PART_A_SHA256  $archive.aa" | shasum --algorithm 256 --check
          echo "$HARMONY_CLI_PART_B_SHA256  $archive.ab" | shasum --algorithm 256 --check

          cat "$archive.aa" "$archive.ab" > "$archive"
          rm "$archive.aa" "$archive.ab"
          echo "$HARMONY_CLI_ARCHIVE_SHA256  $archive" | shasum --algorithm 256 --check

          unzip -q "$archive" -d "$install_root"
          rm "$archive"

          test -x "$install_root/command-line-tools/bin/hvigorw"
          test -x "$install_root/command-line-tools/bin/ohpm"

      - name: Configure Harmony toolchain
        run: |
          set -euo pipefail

          tool_root="$HOME/harmony-cli/$HARMONY_CLI_VERSION/command-line-tools"
          test -d "$tool_root/sdk"

          echo "$tool_root/tool/node/bin" >> "$GITHUB_PATH"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=$tool_root/sdk" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$tool_root/sdk" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$tool_root/sdk/default/openharmony" >> "$GITHUB_ENV"

      - name: Verify Harmony toolchain
        run: |
          set -euo pipefail

          test "$(uname -m)" = "arm64"
          hvigorw -v
          ohpm --version

          previewer="$OHOS_NDK_HOME/previewer/common/bin/Previewer"
          test -x "$previewer"
          file "$previewer"
          otool -L "$previewer"

      - name: Cache ohpm packages
        uses: actions/cache@v4
        with:
          # Cache package downloads only; publishing credentials must never be cached.
          path: ~/.ohpm/cache
          key: harmony-ohpm-packages-${{ runner.os }}-${{ hashFiles('harmony/**/oh-package.json5', 'harmony/**/oh-package-lock.json5') }}
          restore-keys: |
            harmony-ohpm-packages-${{ runner.os }}-

      - name: Install Harmony dependencies
        working-directory: ./harmony
        timeout-minutes: 10
        run: |
          set -euo pipefail

          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all \
            --retry_times 5 \
            --retry_interval 10000 \
            --fetch_timeout 120000 \
            --max_concurrent 10

      - name: Run Harmony local tests
        working-directory: ./harmony
        timeout-minutes: 10
        # entry contains only DevEco's default scaffold case, which is already
        # duplicated in dimina. Build its HAP below without starting a second
        # Previewer instance.
        run: |
          set -euo pipefail

          test_result="dimina/.test/default/intermediates/test/coverage_data/test_result.txt"
          rm -f "$test_result"

          hvigorw test \
            -p module=dimina \
            -p coverage=true \
            --no-parallel \
            --no-daemon

          test -s "$test_result"
          test_summary="$(tail -n 1 "$test_result")"
          printf '%s\n' "$test_summary"
          printf '%s\n' "$test_summary" | grep -Eq '^Tests run: [1-9][0-9]*, Failure: 0, Error: 0, Pass: [1-9][0-9]*, Ignore: [0-9]+$'

      - name: Build and validate Harmony SDK packages
        run: bash harmony/upload.sh --build-only

      - name: Build Harmony example app
        working-directory: ./harmony
        run: >-
          hvigorw --mode module
          -p product=default
          -p module=entry@default
          assembleHap
          --analyze=normal
          --parallel
          --no-daemon

      # Older release tags do not contain the CI authentication helper. Always
      # use automation from this run's commit while building the exact tag above.
      - name: Checkout Harmony release automation
        if: inputs.release_tag != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          sparse-checkout: harmony/scripts/publish-ci.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: ${{ inputs.dry_run && 'Validate OHPM publishing credentials (dry run)' || 'Publish Harmony SDK packages to OHPM' }}
        if: inputs.release_tag != ''
        timeout-minutes: 10
        env:
          HARMONY_OHPM_PRIVATE_KEY: ${{ secrets.HARMONY_OHPM_PRIVATE_KEY }}
          HARMONY_OHPM_KEY_PASSPHRASE: ${{ secrets.HARMONY_OHPM_KEY_PASSPHRASE }}
          HARMONY_OHPM_PUBLISH_ID: ${{ secrets.HARMONY_OHPM_PUBLISH_ID }}
          HARMONY_OHPM_DRY_RUN: ${{ inputs.dry_run }}
          HARMONY_UPLOAD_SCRIPT: ${{ github.workspace }}/harmony/upload.sh
        run: bash .release-automation/harmony/scripts/publish-ci.sh

      - name: Upload Harmony test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-test-reports
          path: |
            harmony/*/.test/default/outputs/test/reports/**
            harmony/*/.test/default/intermediates/test/coverage_data/test_result.txt
            harmony/*/.test/default/intermediates/test/coverage_data/coverage.log
          retention-days: 5
          if-no-files-found: warn
          include-hidden-files: true
