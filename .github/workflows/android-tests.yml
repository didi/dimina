name: Android Tests

on:
  push:
    paths:
      - 'android/**'
      - 'native/media/**'
      - 'examples/miniprogram/base/miniprogram_npm/libpag-miniprogram/index.js'
      - 'examples/miniprogram/base/pages/libpag/assets/libpag.wasm.br'
      - 'examples/miniprogram/base/pages/libpag/assets/video.pag'
  pull_request:
    paths:
      - 'android/**'
      - 'native/media/**'
      - 'examples/miniprogram/base/miniprogram_npm/libpag-miniprogram/index.js'
      - 'examples/miniprogram/base/pages/libpag/assets/libpag.wasm.br'
      - 'examples/miniprogram/base/pages/libpag/assets/video.pag'
  workflow_dispatch:

jobs:
  unit-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Avoid the legacy 'tools' package included in the action's defaults.
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew
        
      - name: Run unit tests
        working-directory: ./android
        run: ./gradlew testDebugUnitTest --no-daemon --parallel

      - name: Verify native video pixels
        run: |
          cmake -S native/media/tests -B "$RUNNER_TEMP/dimina-media-tests" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/dimina-media-tests" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/dimina-media-tests" --output-on-failure
        
      - name: Verify optional AMap publication
        working-directory: ./android
        run: ./gradlew :map-amap:publishReleasePublicationToMavenLocal --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ./android/app/build/reports/tests/testDebugUnitTest
          retention-days: 5
