name: iOS Tests

on:
  push:
    paths: ['iOS/**', 'harmony/**', 'shared/**', '.github/workflows/ios-tests.yml']
  pull_request:
    paths: ['iOS/**', 'harmony/**', 'shared/**', '.github/workflows/ios-tests.yml']
  workflow_dispatch:

jobs:
  unit-test:
    name: iOS Unit Tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select or create iOS Simulator
        id: simulator
        run: |
          SIMULATOR_UDID="$(
            xcrun simctl list devices available --json |
              ruby -rjson -e '
                devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
                simulator = devices.find do |device|
                  device.fetch("isAvailable", true) && device.fetch("name", "").start_with?("iPhone")
                end
                puts simulator.fetch("udid") if simulator
              '
          )"

          if [[ -z "$SIMULATOR_UDID" ]]; then
            SIMULATOR_CONFIG="$(
              xcrun simctl list runtimes available --json |
                ruby -rjson -e '
                  runtimes = JSON.parse(STDIN.read).fetch("runtimes").select do |runtime|
                    runtime["isAvailable"] && runtime["platform"] == "iOS"
                  end
                  runtime = runtimes.max_by { |item| item.fetch("version").split(".").map(&:to_i) }
                  abort "No available iOS Simulator runtime found" unless runtime
                  device_type = runtime.fetch("supportedDeviceTypes").find do |item|
                    item["productFamily"] == "iPhone"
                  end
                  abort "No iPhone device type supports #{runtime.fetch("name")}" unless device_type
                  puts "#{runtime.fetch("identifier")} #{device_type.fetch("identifier")}"
                '
            )"
            read -r RUNTIME_ID DEVICE_TYPE_ID <<< "$SIMULATOR_CONFIG"
            SIMULATOR_UDID="$(xcrun simctl create "Dimina CI" "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
          fi

          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          echo "Using iOS Simulator $SIMULATOR_UDID"

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: iOS/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('iOS/dimina.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        working-directory: ./iOS
        run: |
          xcodebuild -resolvePackageDependencies \
            -project dimina.xcodeproj \
            -scheme dimina \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Run unit tests
        working-directory: ./iOS
        run: |
          xcodebuild test \
            -project dimina.xcodeproj \
            -scheme dimina \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -clonedSourcePackagesDirPath SourcePackages \
            -disableAutomaticPackageResolution \
            -resultBundlePath TestResults.xcresult

      - name: Compress test results
        if: always()
        working-directory: ./iOS
        run: test -d TestResults.xcresult && zip -qr TestResults.xcresult.zip TestResults.xcresult || true

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-reports
          path: ./iOS/TestResults.xcresult.zip
          retention-days: 5
          if-no-files-found: ignore
