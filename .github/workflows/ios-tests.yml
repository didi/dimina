name: iOS Tests

on:
  push:
    paths: ['iOS/**', 'shared/**', 'native/wasm/**', 'third_party/wamr/**', 'Package.swift', 'scripts/package-ios-amap.py', 'scripts/tests/**', '.github/workflows/ios-tests.yml']
  pull_request:
    paths: ['iOS/**', 'shared/**', 'native/wasm/**', 'third_party/wamr/**', 'Package.swift', 'scripts/package-ios-amap.py', 'scripts/tests/**', '.github/workflows/ios-tests.yml']
  workflow_dispatch:

jobs:
  unit-test:
    name: iOS Unit Tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check standalone map package sources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_package_ios_amap.py'

      - name: Run native Wasm regressions
        run: |
          cmake -S native/wasm/tests -B "$RUNNER_TEMP/dimina-wasm-tests" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/dimina-wasm-tests" --parallel 4
          node native/wasm/tests/run.mjs "$RUNNER_TEMP/dimina-wasm-tests"

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: iOS/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('iOS/dimina.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        working-directory: ./iOS
        run: |
          xcodebuild -resolvePackageDependencies \
            -project dimina.xcodeproj \
            -scheme dimina \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Select eligible iOS Simulator
        id: simulator
        working-directory: ./iOS
        run: |
          set -euo pipefail
          # Install the selected Xcode's system components before contacting CoreSimulator.
          sudo xcodebuild -runFirstLaunch
          refresh_runtimes() {
            for probe in 1 2 3; do
              if xcrun simctl list runtimes --json > "$RUNNER_TEMP/dimina-runtimes.json"; then
                return
              else
                status=$?
                if [[ "$probe" -eq 3 ]]; then
                  return "$status"
                fi
                echo "::warning::CoreSimulator is unavailable; restarting service before probe $((probe + 1))"
                killall com.apple.CoreSimulator.CoreSimulatorService || true
                sudo xcodebuild -runFirstLaunch
              fi
            done
          }
          refresh_runtimes

          select_simulator() {
            xcodebuild -showdestinations \
              -project dimina.xcodeproj \
              -scheme dimina \
              -clonedSourcePackagesDirPath SourcePackages \
              -disableAutomaticPackageResolution > "$RUNNER_TEMP/dimina-destinations.txt"
            cat "$RUNNER_TEMP/dimina-destinations.txt"
            SIMULATOR_UDID="$(
              ruby -e '
                available = File.read(ARGV.fetch(0)).split(/Ineligible destinations|Destinations incompatible/).first
                devices = available.lines.filter_map do |line|
                  next unless line.include?("platform:iOS Simulator,")
                  next unless line.match?(/name:(?:iPhone|Dimina CI)/)
                  next if line.include?("error:")
                  udid = line[/id:([0-9A-Fa-f-]{36})/, 1]
                  version = line[/OS:([0-9.]+)/, 1]
                  [version.split(".").map(&:to_i), udid] if udid && version
                end
                simulator = devices.max_by(&:first)
                puts simulator.last if simulator
              ' "$RUNNER_TEMP/dimina-destinations.txt"
            )"
          }

          create_simulator_from_installed_runtime() {
            refresh_runtimes
            cat "$RUNNER_TEMP/dimina-runtimes.json"
            SIMULATOR_CONFIG="$(
              ruby -rjson -rrubygems -e '
                sdk = Gem::Version.new(ARGV.fetch(1))
                runtimes = JSON.parse(File.read(ARGV.fetch(0))).fetch("runtimes").select do |runtime|
                  runtime["isAvailable"] &&
                    runtime.fetch("identifier").start_with?("com.apple.CoreSimulator.SimRuntime.iOS-") &&
                    Gem::Version.new(runtime.fetch("version")) <= sdk
                end
                runtime = runtimes.max_by { |item| Gem::Version.new(item.fetch("version")) }
                exit 0 unless runtime
                device_type = runtime.fetch("supportedDeviceTypes").find do |item|
                  item["productFamily"] == "iPhone"
                end
                exit 0 unless device_type
                puts "#{runtime.fetch("identifier")} #{device_type.fetch("identifier")}"
              ' "$RUNNER_TEMP/dimina-runtimes.json" "$(xcrun --sdk iphonesimulator --show-sdk-version)"
            )"
            if [[ -z "$SIMULATOR_CONFIG" ]]; then
              return
            fi
            read -r RUNTIME_ID DEVICE_TYPE_ID <<< "$SIMULATOR_CONFIG"
            CREATED_UDID="$(xcrun simctl create "Dimina CI" "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
            xcrun simctl boot "$CREATED_UDID"
            xcrun simctl bootstatus "$CREATED_UDID" -b
            select_simulator
          }

          select_simulator
          if [[ -z "$SIMULATOR_UDID" ]]; then
            create_simulator_from_installed_runtime
          fi
          if [[ -z "$SIMULATOR_UDID" ]]; then
            # Retry only the known CoreSimulator connection failure, not arbitrary download errors.
            for attempt in 1 2 3; do
              if xcodebuild -downloadPlatform iOS > "$RUNNER_TEMP/dimina-runtime-download.log" 2>&1; then
                cat "$RUNNER_TEMP/dimina-runtime-download.log"
                break
              else
                status=$?
                cat "$RUNNER_TEMP/dimina-runtime-download.log"
                if [[ "$attempt" -eq 3 ]] || ! grep -q 'Unable to connect to simulator' "$RUNNER_TEMP/dimina-runtime-download.log"; then
                  exit "$status"
                fi
                echo "::warning::CoreSimulator connection failed; restarting service before retry $((attempt + 1))"
                # This step runs on an isolated GitHub-hosted runner; do not delete simulator data.
                killall com.apple.CoreSimulator.CoreSimulatorService || true
                sudo xcodebuild -runFirstLaunch
                refresh_runtimes
              fi
            done
            select_simulator
            if [[ -z "$SIMULATOR_UDID" ]]; then
              create_simulator_from_installed_runtime
            fi
          fi

          if [[ -z "$SIMULATOR_UDID" ]]; then
            xcrun simctl list devices available
            echo "::error::No iPhone Simulator is eligible after runtime installation; check deployment targets and Xcode diagnostics above"
            exit 1
          fi
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          echo "Using eligible iOS Simulator $SIMULATOR_UDID"

      - name: Run unit tests
        working-directory: ./iOS
        run: |
          xcodebuild test \
            -project dimina.xcodeproj \
            -scheme dimina \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -clonedSourcePackagesDirPath SourcePackages \
            -disableAutomaticPackageResolution \
            -resultBundlePath TestResults.xcresult

      - name: Compress test results
        if: always()
        working-directory: ./iOS
        run: test -d TestResults.xcresult && zip -qr TestResults.xcresult.zip TestResults.xcresult || true

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-reports
          path: ./iOS/TestResults.xcresult.zip
          retention-days: 5
          if-no-files-found: ignore
