name: Validate desktop SDK OIDC
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate npm package-scoped OIDC exchange
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'npm:registry.npmjs.org');
          const identityResponse = await fetch(url, {headers: {Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if (!identityResponse.ok) throw new Error('GitHub OIDC request failed: ' + identityResponse.status);
          const identity = await identityResponse.json();
          if (!identity.value) throw new Error('Missing GitHub OIDC identity');
          console.log('::add-mask::' + identity.value);
          const exchange = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@dimina%2Fdesktop-sdk', {method: 'POST', headers: {Authorization: 'Bearer ' + identity.value}});
          if (exchange.status !== 201) throw new Error('npm OIDC exchange failed: ' + exchange.status);
          const credential = await exchange.json();
          if (!credential.token || credential.token_type !== 'oidc') throw new Error('Missing package-scoped npm OIDC token');
          console.log('::add-mask::' + credential.token);
          console.log('npm accepted this workflow for @dimina/desktop-sdk; no version uploaded.');
          NODE
  cargo:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate crates.io OIDC exchange
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Check temporary package-scoped credential
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          echo 'crates.io accepted this workflow; no version uploaded.'
